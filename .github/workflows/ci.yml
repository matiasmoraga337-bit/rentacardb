name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar backend
        id: check
        run: |
          if [ -f "Producción/backend/package.json" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Omitir (sin backend todavía)
        if: steps.check.outputs.run == 'false'
        run: echo "Producción/backend/package.json no existe aún; se omite el job."

      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Producción/backend/package-lock.json

      - name: Instalar dependencias
        if: steps.check.outputs.run == 'true'
        working-directory: Producción/backend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.run == 'true'
        working-directory: Producción/backend
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.check.outputs.run == 'true'
        working-directory: Producción/backend
        run: npm run typecheck --if-present

      - name: Tests
        if: steps.check.outputs.run == 'true'
        working-directory: Producción/backend
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.run == 'true'
        working-directory: Producción/backend
        run: npm run build --if-present

  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detectar frontend
        id: check
        run: |
          if [ -f "Producción/frontend/package.json" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Omitir (sin frontend todavía)
        if: steps.check.outputs.run == 'false'
        run: echo "Producción/frontend/package.json no existe aún; se omite el job."

      - uses: actions/setup-node@v4
        if: steps.check.outputs.run == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Producción/frontend/package-lock.json

      - name: Instalar dependencias
        if: steps.check.outputs.run == 'true'
        working-directory: Producción/frontend
        run: npm ci

      - name: Lint
        if: steps.check.outputs.run == 'true'
        working-directory: Producción/frontend
        run: npm run lint --if-present

      - name: Typecheck
        if: steps.check.outputs.run == 'true'
        working-directory: Producción/frontend
        run: npm run typecheck --if-present

      - name: Tests
        if: steps.check.outputs.run == 'true'
        working-directory: Producción/frontend
        run: npm test --if-present

      - name: Build
        if: steps.check.outputs.run == 'true'
        working-directory: Producción/frontend
        run: npm run build --if-present

  sql:
    name: SQL Server (suite 00-15)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar SQL Server
        run: |
          docker run -d --name rentacardb-db-test \
            -e ACCEPT_EULA=Y \
            -e MSSQL_SA_PASSWORD='RentaCar_Dev123!' \
            mcr.microsoft.com/mssql/server:2022-latest

      - name: Esperar SQL Server
        run: |
          for i in $(seq 1 60); do
            if docker exec rentacardb-db-test /opt/mssql-tools18/bin/sqlcmd \
              -S localhost -U sa -P 'RentaCar_Dev123!' -C -Q 'SELECT 1' >/dev/null 2>&1; then
              echo "SQL Server listo."
              exit 0
            fi
            sleep 2
          done
          echo "SQL Server no inicio a tiempo."
          docker logs rentacardb-db-test
          exit 1

      - name: Ejecutar suite SQL
        shell: pwsh
        run: ./sql/tests/run_tests.ps1

      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sql-test-results
          path: sql/tests/results
          if-no-files-found: ignore

      - name: Limpiar contenedor
        if: always()
        run: docker rm -f rentacardb-db-test

  e2e:
    name: E2E (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_PASSWORD: RentaCar_Dev123!
      JWT_SECRET: ci-e2e-secret
      CORS_ORIGIN: http://localhost:5173
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            Producción/backend/package-lock.json
            Producción/frontend/package-lock.json

      - name: Instalar backend
        working-directory: Producción/backend
        run: npm ci

      - name: Instalar frontend
        working-directory: Producción/frontend
        run: npm ci

      - name: Crear .env para Docker Compose
        run: |
          cat > .env <<EOF
          DB_PASSWORD=${DB_PASSWORD}
          JWT_SECRET=${JWT_SECRET}
          DB_DATABASE=RentaCarDB
          CORS_ORIGIN=${CORS_ORIGIN}
          APP_URL=http://localhost:5173
          EOF

      - name: Levantar base y API
        run: docker compose --env-file .env -f Producción/infra/docker-compose.yml up -d --build db mailpit api

      - name: Esperar API
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:3000/api/health >/dev/null; then
              echo "API lista."
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env -f Producción/infra/docker-compose.yml logs api
          exit 1

      - name: Cargar datos demo
        working-directory: Producción/backend
        env:
          DB_HOST: localhost
          DB_PORT: 14330
          DB_USER: sa
          DB_DATABASE: RentaCarDB
          DB_ENCRYPT: 'true'
          DB_TRUST_SERVER_CERTIFICATE: 'true'
        run: |
          npm run seed
          npm run seed:fotos

      - name: Instalar Chromium de Playwright
        working-directory: Producción/frontend
        run: npx playwright install --with-deps chromium

      - name: Ejecutar E2E y axe
        working-directory: Producción/frontend
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Publicar reporte Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            Producción/frontend/playwright-report
            Producción/frontend/test-results
          if-no-files-found: ignore

      - name: Limpiar stack
        if: always()
        run: docker compose --env-file .env -f Producción/infra/docker-compose.yml down -v